<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgF" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bgF)"/>

  <!-- Signo ? editorial gigante — safe zone center 540,960 -->
  <g transform="translate(540, 960)">
    <!-- Círculo de fondo (subtle white halo) -->
    <circle cx="0" cy="0" r="250" fill="none" stroke="#FAFAF7" stroke-width="14" opacity="0.25"/>

    <!-- Signo de interrogación gigante -->
    <text x="0" y="155" text-anchor="middle"
          font-family="'Inter Tight', 'Inter', 'Georgia', serif"
          font-size="500" font-weight="800" letter-spacing="-10"
          fill="#FAFAF7">?</text>

    <!-- Dot accent verde (highlight) -->
    <circle cx="180" cy="-180" r="20" fill="#10B981"/>
  </g>
</svg>
